<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agent Suite — six apps that run entirely in your browser</title>
<meta name="description" content="Six small AI apps running fully on your own GPU via WebGPU. No API key, no server, no account, no bill — and they keep working offline." />
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="src/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>" />
</head>
<body>

<!-- The engine is global state, so it lives in the sticky bar rather than in a
     panel that scrolls away the moment you start using an app. -->
<header class="topbar">
  <div class="wrap topbar-in">
    <button class="wordmark" onclick="location.hash=''">
      <span class="dot" aria-hidden="true"></span>
      Agent Suite
    </button>
    <div id="boot" class="boot-row"></div>
    <span class="spacer"></span>
    <a class="btn btn-ghost btn-sm hide-sm" href="evals/run.html">Evals</a>
    <a class="btn btn-ghost btn-sm hide-sm" href="https://github.com/YoursSarcastically/agent-suite">Source</a>
  </div>
  <div class="bar-track topbar-bar" id="bar-track" hidden><div class="bar" id="bar"></div></div>
</header>

<main class="wrap">
  <div id="view"></div>
</main>

<footer class="wrap">
  <p>
    Inference by <a href="https://github.com/mlc-ai/web-llm">WebLLM</a>, running on your GPU via WebGPU.
    Needs Chrome/Edge&nbsp;113+ or Safari&nbsp;18+. First load caches the weights; after that it works offline.
  </p>
  <p>
    Built by <a href="https://github.com/YoursSarcastically">YoursSarcastically</a> ·
    <a href="https://github.com/YoursSarcastically/agent-suite">Source</a>
  </p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="src/ui.js"></script>
</body>
</html>
